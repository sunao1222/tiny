[package]
name = "libtiny_tui"
version = "0.1.0"
description = "A terminal UI for tiny"
edition = "2024"

[[bench]]
name = "bench"
harness = false

[features]
default = []
desktop-notifications = ["notify-rust"]
desktop-notifications-static-linking = ["notify-rust", "notify-rust/d_vendored"]

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events", "bracketed-paste"] }
libc = "0.2"
libtiny_common = { path = "../libtiny_common" }
libtiny_wire = { path = "../libtiny_wire" }
log = "0.4"
notify-rust = { version = "4.11", optional = true, default-features = false, features = ["d"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.8"
signal-hook = "0.3"
tempfile = "3.1"
termwiz = { version = "0.23.3", default-features = false }
time = "0.1"
tokio = { version = "1.17", default-features = false, features = ["macros", "rt", "sync", "time"] }
tokio-stream = "0.1"
unicode-segmentation = "1.13"
unicode-width = "0.2"

[dev-dependencies]
bencher = "0.1"
